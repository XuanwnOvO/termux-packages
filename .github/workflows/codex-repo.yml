name: codex-repo

# CodexApp fork: build bootstrap + nodejs-lts + npm for com.codexapp
# from source (compile-time prefix rewriting via scripts/properties.sh),
# assemble an apt repository tree and publish it:
#   - apt repo tree (dists/stable/main/binary-aarch64 + pool/main)
#       -> orphan branch "repo"
#   - bootstrap-aarch64.zip -> GitHub Release asset
#
# NOTE: never pass -I to build-package.sh here. Dependencies must be built
# from source so their compile-time prefix is com.codexapp too.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-repo
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Build bootstrap (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap from source
        run: |
          set -euxo pipefail
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64

      - name: Upload bootstrap zip
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64
          path: bootstrap-aarch64.zip
          if-no-files-found: error

      - name: Upload base debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-bootstrap
          path: output/*.deb
          if-no-files-found: error

  packages:
    name: Build nodejs-lts + npm (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build nodejs-lts
        run: |
          set -euxo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 nodejs-lts

      - name: Build npm
        run: |
          set -euxo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 npm

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-nodejs
          path: output/*.deb
          if-no-files-found: error

  publish:
    name: Assemble apt repo + release
    needs: [bootstrap, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble apt repository tree
        run: |
          set -euxo pipefail
          mkdir -p repo/pool/main repo/dists/stable/main/binary-aarch64
          cp -v artifacts/debs-bootstrap/*.deb repo/pool/main/
          cp -v artifacts/debs-nodejs/*.deb repo/pool/main/
          cd repo
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-aarch64/Packages
          gzip -9n -k -f dists/stable/main/binary-aarch64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="codexapp" \
            -o APT::FTPArchive::Release::Label="codexapp" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="aarch64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="CodexApp package repository" \
            release dists/stable > dists/stable/Release

      - name: Push repo tree to repo branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd repo
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -qm "apt repo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin repo

      - name: Create release with bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="codex-bootstrap-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "artifacts/bootstrap-aarch64/bootstrap-aarch64.zip" \
            --title "$TAG" \
            --notes "Bootstrap built for com.codexapp (aarch64). apt repo: branch repo" \
            --repo "$GITHUB_REPOSITORY"
